name: CI/CD Pipeline

on:
  push:
    branches:
      - test

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest pytest-flask pytest-cov pytest-asyncio
        pip install -r requirements.txt
        pip install -e .

    - name: Run tests
      run: |
        python -m pytest
      env:
        PYTHONPATH: ${GITHUB_WORKSPACE}/src
        DATABASE_URL: "sqlite:///test.db"

  create-pull-request:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: success()

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Create pull request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: test
        base: main
        title: "Merge test branch into main"
        body: |
          This pull request was created automatically by GitHub Actions.
          It merges the `test` branch into `main` after successful tests.
        labels: |
          automated-pull-request
